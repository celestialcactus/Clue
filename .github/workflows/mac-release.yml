name: Build Mac preview
on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        default: both
        options: [both, arm64, x64]
        description: Mac architecture to build
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-mac-intel.cjs
      - run: npm test
      - run: npm run assets
      - run: npm run assets:embeddings
      - name: Check native embeddings before packaging
        run: node -e "const {Embeddings}=require('./src/embeddings.cjs');const m=new Embeddings(require('path').resolve('assets'));m.encode('Local document test').then(v=>{if(v.length!==384)throw Error('Invalid embedding');return m.dispose()}).catch(e=>{console.error(e);process.exitCode=1})"
      - run: npm run build:mac -- --${{ matrix.arch }}
      - name: Validate packaged app and local inference
        run: node scripts/smoke-package.cjs
      - name: Verify app signature and disk image
        run: |
          codesign --verify --deep --strict dist/mac*/Clue.app
          hdiutil verify dist/*.dmg
      - run: node scripts/package-share-mac.cjs
      - name: Upload tested files to draft release
        run: gh release upload v0.3.0-mac-preview dist/*.dmg dist/*.zip dist/*.sha256 --clobber
